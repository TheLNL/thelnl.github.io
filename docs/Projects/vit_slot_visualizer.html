<meta charset="UTF-8">

<title>Timetable Slot Visualizer</title>
<style>
  body { font: 11px sans-serif; margin: 0; }
  button, summary { font: inherit; }
  #tooltip { position: fixed; display: none; z-index: 10; background: #fff; border: 1px solid #000; pointer-events: none; max-width: 90vw; }
  #wrap { overflow-x: auto; }
  /* one column per 10 minutes, 08:00 -> 19:20 (68 columns) */
  table { border-collapse: collapse; width: 100%; min-width: 900px; table-layout: fixed; }
  th, td { border: 1px solid #ccc; padding: 0; text-align: center; font-weight: normal; }
  thead th { text-align: left; padding-left: 2px; }
  td { position: relative; height: 16px; }
  tr.lab td, tr.lab th { border-bottom-color: #999; }
  td { text-align: left; line-height: 12px; }
  .in, .dots { display: contents; }
  .lbl { display: inline; margin-right: 3px; color: #888; white-space: nowrap; }
  .dot { display: inline-block; vertical-align: middle; width: 12px; height: 12px; margin: 1px; border-radius: 50%; cursor: pointer;
    color: #fff; font-size: 8px; line-height: 12px; text-align: center; overflow: hidden; }
  .dot.picked { outline: 1px solid #000; outline-offset: 1px; }
  .dot.hl { background: #000 !important; }
  #legend span { margin-right: 8px; }
  #legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 2px; }
  textarea { width: 100%; box-sizing: border-box; }
  #manual:not(:empty) { border: 1px solid #999; background: #f4f4f4; padding: 6px; margin: 4px 0; }
  #disclaimer { background: #eef4fb; color: #1f3a5f; border: 1px solid #c5d8ee; padding: 3px 6px; margin: 0 0 4px; }
  #manual div { margin: 3px 0; }
  #warn:not(:empty) { white-space: pre-wrap; background: #fff3cd; color: #842029; border: 1px solid #e0a800; border-left: 4px solid #d9534f; padding: 4px 6px; margin: 4px 0; }
</style>
</head>

const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];

const COLORS = ['#e6194b', '#3cb44b', '#4363d8', '#f58231', '#911eb4', '#00b5b5', '#f032e6', '#9a6324', '#b8a000', '#808080', '#800000', '#6b8e00'];
const UNITS = 68; // 10-minute columns from 08:00 to 19:20

// Theory slots per day: 5 morning (08:00..12:00) and 5 evening (14:00..18:00), 50 min each
const THEORY = {
  am: [['A1','F1','D1','TB1','TG1'], ['B1','G1','E1','TC1','TAA1'], ['C1','A1','F1','',''], ['D1','B1','G1','TE1','TCC1'], ['E1','C1','TA1','TF1','TD1']],
  pm: [['A2','F2','D2','TB2','TG2'], ['B2','G2','E2','TC2','TAA2'], ['C2','A2','F2','TD2','TBB2'], ['D2','B2','G2','TE2','TCC2'], ['E2','C2','TA2','TF2','TDD2']]
};
// Lab slots are 100 min: 08:00, 09:50, 11:40 and 14:00, 15:50, 17:40 (minutes from 08:00)
const LAB_STARTS = [0, 110, 220];

const CELLS = {};       // key -> { d, row, unit, span, label }   (row 0 = theory, 1 = lab)
const SLOT_CELLS = {};  // slot name -> [cell keys]

function addCell(d, row, startMin, lenMin, label, names) {
  const key = `${d}_${row}_${startMin}`;
  CELLS[key] = { d, row, unit: startMin / 10, span: lenMin / 10, label };
  names.forEach(n => (SLOT_CELLS[n] = SLOT_CELLS[n] || []).push(key));
}

for (let d = 0; d < 5; d++) {
  ['am', 'pm'].forEach((half, hi) => {
    for (let i = 0; i < 5; i++) {
      const name = THEORY[half][d][i];
      if (name) addCell(d, 0, hi * 360 + i * 60, 50, name, [name]);
    }
    LAB_STARTS.forEach((s, k) => {
      const n = hi * 30 + d * 6 + k * 2 + 1;
      const lab = `L${n}+L${n + 1}`;
      addCell(d, 1, hi * 360 + s, 100, lab, [lab, `L${n}`, `L${n + 1}`]);
    });
  });
}

let options = [];
let courseColors = {};
let filters = {}; // course -> selected option id
let deleted = new Set(); // ids of options removed with right-click (shown in the bin)

function cellKeys(combo) {
  const keys = new Set(), unk = [];
  const t = combo.split('+').map(s => s.trim()).filter(Boolean);
  for (let i = 0; i < t.length; i++) {
    const pair = t[i] + '+' + t[i + 1];
    if (i < t.length - 1 && SLOT_CELLS[pair]) {
      SLOT_CELLS[pair].forEach(k => keys.add(k));
      i++;
    } else if (SLOT_CELLS[t[i]]) {
      SLOT_CELLS[t[i]].forEach(k => keys.add(k));
    } else if (t[i].toUpperCase() !== 'NIL') {
      unk.push(t[i]);
    }
  }
  return { cells: [...keys], unk };
}

// ground-floor venue prefixes that count as the same building (edit if your venues differ)
const GROUND_FLOOR = { PRPG: 'PRP', SJTG: 'SJT' };

// building part of a venue string like "PRPG17" -> "PRPG", "TT116" -> "TT"
function venueBlock(v) {
  if (!v || v === 'N/A' || v === 'NIL') return 'N/A';
  const m = v.trim().match(/^([A-Za-z]+)/);
  if (!m) return v;
  const b = m[1].toUpperCase();
  return GROUND_FLOOR[b] || b;
}

// raw rows [slot, venue, faculty, type] (theory and lab on separate lines) ->
// one row per theory entry with its faculty's lab merged in.
// Morning theory (slot has a 1) goes with an afternoon lab (L31+) and afternoon theory (2) with a morning lab (L1-L30).
// If a professor has several theory rows in the same half and/or several candidate labs, the pairing
// can't be known: all of them are put into ONE option and reported in ambiguousGroups.
function combineRows(rows, course) {
  const theory = [], labs = [], oc = [];
  rows.forEach(([slot, venue, faculty, type, id]) => {
    const r = { slot, venue, faculty, type, id };
    if (type === 'ETH' || type === 'TH') theory.push(r);
    else if (type === 'ELA') labs.push(r);
    else oc.push(r); // LO (lab-only) and OC rows stand alone: never paired with theory
  });

  const half = s => s.split('+')[0].includes('1') ? 'am' : 'pm';
  const labHalf = s => { const m = s.match(/L(\d+)/); return m ? (+m[1] <= 30 ? 'am' : 'pm') : null; };
  const venueOf = rs => {
    const b = [];
    rs.forEach(r => { const x = venueBlock(r.venue); if (x !== 'N/A' && !b.includes(x)) b.push(x); });
    return b.length ? b.join('+') : 'N/A';
  };
  const typeOf = t => t === 'ETH' ? 'ETH+ELA' : t + '+ELA';

  const out = [];
  const used = new Set();
  const done = new Set(); // faculty|half groups already emitted as an ambiguous option
  theory.forEach(th => {
    const fac = th.faculty, h = half(th.slot), key = fac + '|' + h;
    if (done.has(key)) return;
    const facLabs = labs.filter(l => l.faculty === fac);
    if (!facLabs.length) {
      out.push([th.slot, venueBlock(th.venue), fac, th.type, [th.id]]);
      return;
    }
    const sameHalf = theory.filter(t => t.faculty === fac && half(t.slot) === h);
    const allTh = theory.filter(t => t.faculty === fac);
    if (allTh.length === 1 && facLabs.length === 1 && labHalf(facLabs[0].slot) === h)
      ruleConflicts.push(`${course}: ${fac} (${th.slot} with ${facLabs[0].slot})`);
    let cand = facLabs.filter(l => labHalf(l.slot) && labHalf(l.slot) !== h);
    if (!cand.length) cand = facLabs;
    const man = manualPairs[course + '|' + key];
    if (man && man.length === sameHalf.length) {
      done.add(key);
      sameHalf.forEach((t, i) => {
        const l = cand.find(x => x.slot === man[i]);
        if (!l) {
          inputWarnings.push(`${course}: manual grouping for ${fac} refers to lab "${man[i]}" which no longer exists; ${t.slot} is shown without a lab`);
          out.push([t.slot, venueBlock(t.venue), fac, t.type, [t.id]]);
          return;
        }
        used.add(l);
        out.push([`${t.slot} + ${l.slot}`, venueOf([t, l]), fac, typeOf(t.type), [t.id, l.id]]);
      });
      return;
    }
    cand.forEach(l => used.add(l));
    if (sameHalf.length === 1 && cand.length === 1) {
      out.push([`${th.slot} + ${cand[0].slot}`, venueOf([th, cand[0]]), fac, typeOf(th.type), [th.id, cand[0].id]]);
    } else {
      done.add(key);
      const ts = sameHalf.map(t => t.slot), ls = cand.map(l => l.slot);
      out.push([[...ts, ...ls].join(' + '), venueOf([...sameHalf, ...cand]), fac, typeOf(th.type), [...sameHalf.map(t => t.id), ...cand.map(l => l.id)]]);
      ambiguousGroups.push({ course, key, fac, theory: sameHalf, labs: cand, text: `${fac} (${ts.join(', ')} with ${ls.join(', ')})` });
    }
  });
  oc.forEach(o => out.push([o.slot, venueBlock(o.venue), o.faculty, o.type, [o.id]]));
  labs.forEach(l => { if (!used.has(l)) { droppedLabs.push(`${course}: ${l.faculty} ${l.slot} (${l.venue})`); droppedIds.push(l.id); } });
  return out;
}

// accepts raw professors_and_slots.md data (header "Slot Detail"); blocks that already have
// combined rows (header "Slot Combination") are used as they are
let droppedLabs = []; // lab rows that did not end up in any option
let ambiguousGroups = []; // professors whose theory/lab pairing can't be decided
let manualPairs = {};     // 'course|faculty|half' -> lab slot chosen for each theory row, set with the Group manually panel
let currentText = '';
let rowSeq = 0, allIds = new Set(), droppedIds = []; // every input row gets an id so we can prove each one ends up somewhere
let recon = { read: 0, placed: 0, missing: [] };
let ruleConflicts = []; // professors whose only theory and lab are in the same half of the day
let skippedLines = []; // input lines with fewer than 3 tab-separated columns
let inputWarnings = []; // any other problem found in the input

function parse(text) {
  droppedLabs = [];
  ambiguousGroups = [];
  skippedLines = [];
  rowSeq = 0; allIds = new Set(); droppedIds = [];
  ruleConflicts = [];
  inputWarnings = [];
  if (!text.trim()) inputWarnings.push('no data was entered');
  else if (!/^#\s/.test(text.trimStart())) inputWarnings.push('input does not start with a "# Course name" header; its first line was used as the course name');
  const out = [];
  const count = {}; // options are numbered 1, 2, 3... within their course
  text.split(/\n#\s+/).forEach((block, b) => {
    if (!block.trim()) return;
    const lines = block.trim().split('\n');
    const course = lines[0].replace(/^#\s*/, '').trim();
    let combined = false;
    let rows = [];
    const bad = msg => inputWarnings.push(`${course || '(no course name)'}: ${msg}`);
    if (!course) bad('course header has no name');
    const seen = new Set();
    for (let i = 1; i < lines.length; i++) {
      const rawLine = lines[i].replace(/\r$/, ''); // keep leading/trailing tabs so empty columns stay visible
      const line = rawLine.trim();
      if (!line) continue;
      if (line.startsWith('Slot Combination')) { combined = true; continue; }
      if (line.startsWith('Slot Detail')) continue;
      const p = rawLine.split('\t').map(s => s.trim());
      if (p.length < 3) { skippedLines.push(`${course}: ${line}`); continue; }
      if (seen.has(p.join('\t'))) bad(`duplicate row "${p.join(' | ')}"`);
      seen.add(p.join('\t'));
      if (p.length > 4) bad(`extra columns ignored in "${line}"`);
      if (!p[0]) bad(`missing slot in "${line}"`);
      if (!p[1]) bad(`missing venue in "${line}"`);
      if (!p[2]) bad(`missing faculty in "${line}"`);
      allIds.add(rowSeq);
      rows.push([p[0], p[1], p[2], p[3] || '', rowSeq++]);
    }
    if (!rows.length) bad('no data rows');
    if (!combined) rows.forEach(r => {
      const [slot, , , type] = r;
      if (!type) bad(`missing course type in "${r.join(' | ')}"`);
      else if (!['ETH', 'TH', 'ELA', 'LO', 'OC'].includes(type)) bad(`unknown course type "${type}" in "${r.join(' | ')}"`);
      if ((type === 'ETH' || type === 'TH') && !/[12]/.test(slot.split('+')[0])) bad(`can't tell morning/afternoon from theory slot "${slot}"`);
      if ((type === 'ELA' || type === 'LO') && !/L\d+/.test(slot)) bad(`lab slot "${slot}" is not of the form L<number>`);
    });
    if (!combined) rows = combineRows(rows, course);
    else rows = rows.map(r => [r[0], r[1], r[2], r[3], [r[4]]]);
    rows.forEach((p, i) => {
      const { cells, unk } = cellKeys(p[0]);
      count[course] = (count[course] || 0) + 1;
      out.push({ id: `o${b}_${i}`, n: count[course], course, combo: p[0], venue: p[1], faculty: p[2], cells, unk, src: p[4] });
    });
  });
  // proof that nothing is lost: every input row must be inside an option or reported as an unused lab
  const covered = new Set(droppedIds);
  out.forEach(o => o.src.forEach(id => covered.add(id)));
  const missing = [...allIds].filter(id => !covered.has(id));
  recon = { read: allIds.size + skippedLines.length, placed: covered.size, missing };
  if (missing.length) inputWarnings.push(`INTERNAL CHECK FAILED: ${missing.length} input row(s) are not shown in any option and not reported anywhere else`);
  return out;
}

// grid dot: click = filter to this option, right-click = delete it
// bin dot:  click or right-click = bring it back
function makeDot(o, binned) {
  const dot = document.createElement('div');
  dot.className = 'dot' + (!binned && filters[o.course] ? ' picked' : '');
  dot.dataset.id = o.id;
  dot.textContent = o.n;
  dot.style.background = courseColors[o.course];
  dot.onmouseenter = e => hoverOn(e, o);
  dot.onmousemove = moveTip;
  dot.onmouseleave = hoverOff;
  dot.onclick = () => binned ? restoreOpt(o) : toggle(o);
  dot.oncontextmenu = e => { e.preventDefault(); binned ? restoreOpt(o) : removeOpt(o); };
  return dot;
}

function slotTd(key, byCell) {
  const c = CELLS[key];
  const td = document.createElement('td');
  td.colSpan = c.span;

  const lbl = document.createElement('div');
  lbl.className = 'lbl';
  lbl.textContent = c.label;

  const dots = document.createElement('div');
  dots.className = 'dots';
  (byCell[key] || []).forEach(o => dots.appendChild(makeDot(o, false)));
  const wrap = document.createElement('div');
  wrap.className = 'in';
  wrap.append(lbl, dots);
  td.appendChild(wrap);
  return td;
}

function emptyTd(span) {
  const td = document.createElement('td');
  td.colSpan = span;
  return td;
}

// one row of a day: cells in time order, empty cells fill the gaps up to 19:20
function buildRow(d, row, byCell) {
  const tr = document.createElement('tr');
  if (row === 1) tr.className = 'lab';
  if (row === 0) {
    const th = document.createElement('th');
    th.rowSpan = 2;
    th.textContent = DAYS[d];
    tr.appendChild(th);
  }
  const keys = Object.keys(CELLS).filter(k => CELLS[k].d === d && CELLS[k].row === row)
    .sort((a, b) => CELLS[a].unit - CELLS[b].unit);
  let pos = 0;
  keys.forEach(k => {
    const c = CELLS[k];
    if (c.unit > pos) tr.appendChild(emptyTd(c.unit - pos));
    tr.appendChild(slotTd(k, byCell));
    pos = c.unit + c.span;
  });
  if (pos < UNITS) tr.appendChild(emptyTd(UNITS - pos));
  return tr;
}

function renderHeader() {
  const cols = document.getElementById('cols');
  cols.innerHTML = '<col style="width:30px">' + '<col>'.repeat(UNITS) + '<col style="width:46px">';
  const head = document.getElementById('head');
  head.innerHTML = '';
  const tr = document.createElement('tr');
  tr.innerHTML = '<th>Day</th>' + HOURS.map((h, i) => `<th colspan="${i === 11 ? 2 : 6}">${h}</th>`).join('') + '<th title="Options with no timing" style="overflow:hidden;white-space:nowrap">No time</th>';
  head.appendChild(tr);
}

function render() {
  // only the selected option is shown for a course that has one selected
  const byCell = {};
  const noTiming = []; // options that have no slot cells (e.g. NIL)
  options.forEach(o => {
    if (deleted.has(o.id)) return;
    const sel = filters[o.course];
    if (sel && sel !== o.id) return;
    if (!o.cells.length) noTiming.push(o);
    o.cells.forEach(k => (byCell[k] = byCell[k] || []).push(o));
  });

  const body = document.getElementById('gridBody');
  body.innerHTML = '';
  DAYS.forEach((day, d) => {
    body.appendChild(buildRow(d, 0, byCell));
    body.appendChild(buildRow(d, 1, byCell));
  });
  // final column: one tall cell spanning every day row
  const nt = document.createElement('td');
  nt.rowSpan = DAYS.length * 2;
  nt.style.verticalAlign = 'top';
  noTiming.forEach(o => nt.appendChild(makeDot(o, false)));
  body.firstChild.appendChild(nt);

  document.getElementById('legend').innerHTML = Object.keys(courseColors)
    .map(c => `<span><i style="background:${courseColors[c]}"></i>${c}</span>`).join('');
  const bin = document.getElementById('bin');
  bin.innerHTML = '';
  if (deleted.size) {
    bin.append('Bin: ');
    options.filter(o => deleted.has(o.id)).forEach(o => bin.appendChild(makeDot(o, true)));
  }
  document.getElementById('resetBtn').style.display = Object.keys(filters).length ? '' : 'none';

  const unmapped = [...new Set(options.filter(o => o.unk.length).map(o => `${o.unk.join(', ')} (${o.course})`))];
  const warn = [];
  if (unmapped.length) warn.push('Unmapped slots: ' + unmapped.join('; '));
  const byCourse = {};
  ambiguousGroups.forEach(a => (byCourse[a.course] = byCourse[a.course] || []).push(a.text));
  Object.keys(byCourse).forEach(c => warn.push(`${c}: grouping can't be done properly for this course, assign manually. These are grouped together as one option each: ` + byCourse[c].join('; ')));
  if (inputWarnings.length) warn.push(`${inputWarnings.length} input problem(s): ` + inputWarnings.slice(0, 20).join('; ') + (inputWarnings.length > 20 ? `; ...and ${inputWarnings.length - 20} more` : ''));
  if (ruleConflicts.length) warn.push(`${ruleConflicts.length} professor(s) have their only theory and lab in the same half of the day, which contradicts the assumed rule (morning theory goes with afternoon lab, and the reverse). Pairing of professors with several theory/lab rows may be wrong: ` + ruleConflicts.slice(0, 20).join('; '));
  if (skippedLines.length) warn.push(`${skippedLines.length} input line(s) skipped (need at least 3 tab-separated columns): ` + skippedLines.join('; '));
  if (droppedLabs.length) warn.push(`${droppedLabs.length} lab rows not used (one lab is paired per theory row, or the professor has no theory row): ` + droppedLabs.join('; '));
  document.getElementById('warn').textContent = warn.join('\n');
  let shown = 0;
  options.forEach(o => { if (!deleted.has(o.id) && !(filters[o.course] && filters[o.course] !== o.id)) shown++; });
  const rc = document.getElementById('recon');
  rc.style.color = recon.missing.length ? '#b00' : '#555';
  rc.textContent = `Input check: ${recon.read} rows read -> ${recon.placed} placed in ${options.length} options` +
    `, ${droppedIds.length} unused labs and ${skippedLines.length} skipped lines (both warned above)` +
    (recon.missing.length ? ` -- ${recon.missing.length} ROWS MISSING` : ' -- all rows accounted for') +
    `. Showing ${shown} of ${options.length} options (${deleted.size} in bin, ${options.length - deleted.size - shown} hidden by course filter).`;
  document.getElementById('groupBtn').style.display = (ambiguousGroups.length || Object.keys(manualPairs).length) ? '' : 'none';
}

function hoverOn(e, o) {
  const tt = document.getElementById('tooltip');
  tt.innerHTML = `<b>${o.course}</b> (option ${o.n})<br>Prof: ${o.faculty}<br>Slot: ${o.combo}<br>Venue: ${o.venue}`;
  tt.style.display = 'block';
  moveTip(e);
  document.querySelectorAll(`.dot[data-id="${o.id}"]`).forEach(x => x.classList.add('hl'));
}

// follow the cursor, flipping to the other side of it when the tooltip would leave the screen
function moveTip(e) {
  const tt = document.getElementById('tooltip');
  const w = tt.offsetWidth, h = tt.offsetHeight;
  let x = e.clientX + 12, y = e.clientY + 12;
  if (x + w > window.innerWidth) x = e.clientX - w - 12;
  if (y + h > window.innerHeight) y = e.clientY - h - 12;
  tt.style.left = Math.max(0, x) + 'px';
  tt.style.top = Math.max(0, y) + 'px';
}

function hoverOff() {
  document.getElementById('tooltip').style.display = 'none';
  document.querySelectorAll('.dot.hl').forEach(x => x.classList.remove('hl'));
}

function removeOpt(o) {
  deleted.add(o.id);
  if (filters[o.course] === o.id) delete filters[o.course];
  hoverOff();
  render();
}

function restoreOpt(o) {
  deleted.delete(o.id);
  hoverOff();
  render();
}

function toggle(o) {
  if (filters[o.course] === o.id) delete filters[o.course];
  else filters[o.course] = o.id;
  hoverOff();
  render();
}

function showError(err) {
  inputWarnings = [`could not process the input (${err && err.message ? err.message : err})`];
  droppedLabs = []; ambiguousGroups = []; skippedLines = [];
}

function reparse() {
  try { options = parse(currentText); } catch (err) { options = []; showError(err); }
  filters = {};
  deleted = new Set();
  document.getElementById('manual').innerHTML = '';
  document.getElementById('groupBtn').textContent = 'Group manually';
  render();
}

function toggleManual() {
  const box = document.getElementById('manual');
  const btn = document.getElementById('groupBtn');
  if (box.innerHTML) { box.innerHTML = ''; btn.textContent = 'Group manually'; return; }
  btn.textContent = 'Hide manual grouping';
  const sels = [];
  ambiguousGroups.forEach(g => {
    const d = document.createElement('div');
    d.append(`${g.course} - ${g.fac}:`);
    g.theory.forEach((t, ti) => {
      d.append(` ${t.slot} (${t.venue}) with `);
      const sel = document.createElement('select');
      sel.innerHTML = '<option value="">choose lab</option>' +
        g.labs.map(l => `<option value="${l.slot}">${l.slot} (${l.venue})</option>`).join('');
      d.appendChild(sel);
      sels.push([g, ti, sel]);
    });
    box.appendChild(d);
  });
  if (ambiguousGroups.length) {
    const ok = document.createElement('button');
    ok.textContent = 'Apply grouping';
    ok.onclick = () => {
      const chosen = {};
      sels.forEach(([g, ti, sel]) => { const k = g.course + '|' + g.key; (chosen[k] = chosen[k] || [])[ti] = sel.value; });
      let changed = false;
      Object.keys(chosen).forEach(k => {
        if (chosen[k].every(x => x)) { manualPairs[k] = chosen[k]; changed = true; }
      });
      if (changed) reparse(); else alert('Choose a lab for every theory slot of a professor first.');
    };
    box.appendChild(ok);
  }
  if (Object.keys(manualPairs).length) {
    const clr = document.createElement('button');
    clr.textContent = 'Clear manual groupings';
    clr.onclick = () => { manualPairs = {}; reparse(); };
    box.appendChild(clr);
  }
  if (!box.innerHTML) { box.textContent = 'Nothing to group manually.'; }
  if (box.scrollIntoView) box.scrollIntoView({ block: 'nearest' });
}

function init(text) {
  currentText = text;
  manualPairs = {};
  try { options = parse(text); } catch (err) { options = []; showError(err); }
  filters = {};
  deleted = new Set();
  courseColors = {};
  [...new Set(options.map(o => o.course))].forEach((c, i) =>
    courseColors[c] = i < COLORS.length ? COLORS[i] : `hsl(${(i * 137.5) % 360}, 70%, 40%)`);
  render();
}

document.getElementById('rawInput').value = DEFAULT_DATA;
document.getElementById('applyBtn').onclick = () => init(document.getElementById('rawInput').value);
document.getElementById('groupBtn').addEventListener('click', toggleManual);
document.getElementById('resetBtn').onclick = () => { filters = {}; render(); };
window.addEventListener('error', e => {
  document.getElementById('warn').textContent += '\nScript error: ' + e.message;
});
renderHeader();
init(DEFAULT_DATA);
</script>
</body>
</html>
